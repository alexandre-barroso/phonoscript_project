[package]
name = "convalgen"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
description = "Professional constraint-grammar analysis for OT, HG, MaxEnt, serial grammars, Second-Order Tableaux, and Q-Calculus"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.33.3"
phonoscript = { path = "../../phonoscript", version = "1.2.0" }
ttf-noto-sans = { version = "0.1.2", default-features = false, features = ["regular", "bold"] }
rfd = "0.17.2"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSURL"] }

[[bin]]
name = "phonoscript-gui"
path = "src/main.rs"

[[bin]]
name = "build-release-visuals"
path = "src/bin/build-release-visuals.rs"
